<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>PDF Reader</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Quicksand:wght@400;500;600;700&display=swap">
<style>
/* Layout: sticky toolbar over a scrolling stage; the PDF page sits on a paper sheet, with a Text tab for extracted content. */
:root{
  --bg:#fff5f9; --surface:#ffffff; --fg:#4a2a3d; --muted:#8a6578; --line:#f5cfe0;
  --accent:#d6347f; --accent-fg:#ffffff; --stage:#fde4ee; --shadow:0 2px 6px rgba(214,52,127,.18),0 10px 28px rgba(214,52,127,.14);
  --font:Quicksand,"Nunito",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif; --mono:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#2a1722; --surface:#38202e; --fg:#fbe6ef; --muted:#d0a5ba; --line:#5a3448;
  --accent:#ff8fbf; --accent-fg:#3a0d22; --stage:#201119; --shadow:0 2px 6px rgba(0,0,0,.5),0 10px 28px rgba(255,143,191,.10); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#2a1722; --surface:#38202e; --fg:#fbe6ef; --muted:#d0a5ba; --line:#5a3448;
  --accent:#ff8fbf; --accent-fg:#3a0d22; --stage:#201119; --shadow:0 2px 6px rgba(0,0,0,.5),0 10px 28px rgba(255,143,191,.10); color-scheme:dark}
html,body{height:100%}
body{background:var(--bg);color:var(--fg);font-family:var(--font);font-size:14px;line-height:1.5;display:flex;flex-direction:column;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--surface)}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--surface);border-bottom:1px solid var(--line);
  margin-inline:calc(-1*max(16px,env(safe-area-inset-left,0px)));padding:10px max(16px,env(safe-area-inset-right,0px)) 10px max(16px,env(safe-area-inset-left,0px));
  display:flex;flex-wrap:wrap;gap:8px 14px;align-items:center}
.brand{font-weight:700;font-size:16px;color:var(--accent);display:flex;align-items:center;gap:8px;margin-right:4px}
.brand svg{width:22px;height:22px;color:var(--accent)}
.group{display:flex;align-items:center;gap:6px}
.name{color:var(--muted);font-size:13px;min-width:0;max-width:240px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
button,.btn{font:inherit;color:var(--fg);background:transparent;border:1px solid var(--line);border-radius:999px;padding:6px 14px;cursor:pointer;line-height:1.2;min-height:34px}
button:hover,.btn:hover{background:var(--bg)}
button:disabled{opacity:.4;cursor:default}
button:focus-visible,.btn:focus-visible,input:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.primary{background:var(--accent);color:var(--accent-fg);border-color:var(--accent);font-weight:600}
.primary:hover{background:var(--accent);filter:brightness(1.08)}
input[type=number]{font:inherit;width:56px;text-align:center;background:var(--bg);color:var(--fg);border:1px solid var(--line);border-radius:999px;padding:6px 4px;min-height:34px;font-variant-numeric:tabular-nums}
.of,.zoom{color:var(--muted);font-variant-numeric:tabular-nums;font-size:13px}
.zoom{min-width:44px;text-align:center}
.tabs{display:flex;border:1px solid var(--line);border-radius:999px;overflow:hidden}
.tabs button{border:0;border-radius:0}
.tabs button[aria-pressed="true"]{background:var(--accent);color:var(--accent-fg);font-weight:600}
.spacer{flex:1}
main{flex:1;min-height:0;position:relative;margin-inline:calc(-1*max(16px,env(safe-area-inset-left,0px)));background:var(--stage);overflow:auto;
  padding:20px max(16px,env(safe-area-inset-right,0px)) 28px max(16px,env(safe-area-inset-left,0px))}
.sheet{margin:0 auto;width:max-content;max-width:none;background:#fff;box-shadow:var(--shadow);line-height:0;border-radius:10px;overflow:hidden}
canvas{display:block}
.text{margin:0 auto;max-width:72ch;background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:20px 22px;
  white-space:pre-wrap;word-break:break-word;font-family:var(--mono);font-size:13px;line-height:1.65;min-width:0}
.text-head{max-width:72ch;margin:0 auto 10px;display:flex;justify-content:space-between;align-items:center;gap:10px;color:var(--muted);font-size:13px}
.drop{position:absolute;inset:10px;border:2px dashed var(--accent);border-radius:10px;background:color-mix(in srgb,var(--stage) 86%,transparent);
  display:flex;align-items:center;justify-content:center;font-weight:600;color:var(--accent);z-index:4}
.welcome{max-width:460px;margin:6vh auto 0;text-align:center;display:flex;flex-direction:column;align-items:center;gap:14px;
  background:var(--surface);border:1px solid var(--line);border-radius:24px;padding:34px 26px 28px;box-shadow:var(--shadow)}
.welcome[hidden]{display:none}
.welcome svg{width:44px;height:44px;color:var(--accent)}
.welcome h1{margin:0;font-size:26px;line-height:1.2;color:var(--accent);text-wrap:balance}
.welcome p{margin:0;color:var(--muted);text-wrap:pretty}
.welcome .hint{font-size:13px}
.welcome .credit{margin-top:6px;padding-top:14px;border-top:1px solid var(--line);align-self:stretch;font-weight:700;color:var(--accent)}
.msg{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);color:var(--muted);text-align:center;padding:0 16px}
.err{color:#b3261e}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .err{color:#ff8a80}}
:root[data-theme="dark"] .err{color:#ff8a80}
@media (max-width:560px){.name{max-width:100%;order:9;flex-basis:100%}}
</style>

<header>
  <div class="brand">
    <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M12 21s-7.5-4.6-9.6-9.2C.8 8.4 2.6 4.5 6.3 4.5c2 0 3.5 1.1 4.2 2.5.4.7 1.4.7 1.8 0 .7-1.4 2.2-2.5 4.2-2.5 3.7 0 5.5 3.9 3.9 7.3C19.5 16.4 12 21 12 21z"/></svg>
    PDF Reader
  </div>
  <div class="group">
    <label class="btn primary" for="file" tabindex="0" id="openBtn">Open PDF</label>
    <input id="file" type="file" accept="application/pdf,.pdf" hidden>
  </div>
  <div class="group" id="nav">
    <button id="prev" aria-label="Previous page" disabled>&#8249;</button>
    <input id="pageInput" type="number" min="1" value="1" aria-label="Page number" disabled>
    <span class="of" id="pageCount">/ 0</span>
    <button id="next" aria-label="Next page" disabled>&#8250;</button>
  </div>
  <div class="group">
    <button id="zout" aria-label="Zoom out" disabled>&minus;</button>
    <input id="zoomInput" type="number" min="25" max="400" step="5" value="100" aria-label="Zoom percent" disabled>
    <span class="of">%</span>
    <button id="zin" aria-label="Zoom in" disabled>+</button>
    <button id="fit" disabled>Fit width</button>
  </div>
  <div class="tabs" role="group" aria-label="View">
    <button id="tabPage" aria-pressed="true">Page</button>
    <button id="tabText" aria-pressed="false">Text</button>
  </div>
  <span class="name" id="fileName"></span>
</header>

<main id="stage" tabindex="-1">
  <section class="welcome" id="welcome">
    <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M12 21s-7.5-4.6-9.6-9.2C.8 8.4 2.6 4.5 6.3 4.5c2 0 3.5 1.1 4.2 2.5.4.7 1.4.7 1.8 0 .7-1.4 2.2-2.5 4.2-2.5 3.7 0 5.5 3.9 3.9 7.3C19.5 16.4 12 21 12 21z"/></svg>
    <h1>Welcome to PDF Reader</h1>
    <p>Open a PDF to read it page by page, zoom to any size, and view its text. Your file stays in your browser.</p>
    <label class="btn primary" for="file" tabindex="0">Open PDF</label>
    <p class="hint">or drop a file anywhere on this page</p>
    <p class="credit">Made by Aarchi Palikhel</p>
  </section>
  <div class="msg" id="msg" hidden></div>
  <div class="sheet" id="sheet" hidden><canvas id="canvas"></canvas></div>
  <div id="textWrap" hidden>
    <div class="text-head"><span id="textInfo"></span><button id="copyText">Copy text</button></div>
    <div class="text" id="textBody"></div>
  </div>
  <div class="drop" id="drop" hidden>Drop a PDF to open it</div>
</main>

<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<script>
(function(){
  var $=function(id){return document.getElementById(id)};
  var stage=$('stage'),sheet=$('sheet'),canvas=$('canvas'),msg=$('msg'),textWrap=$('textWrap'),textBody=$('textBody'),textInfo=$('textInfo');
  var pdf=null,pageNum=1,scale=1,mode='page',task=null,fitMode=true,textCache={},renderToken=0;

  function setMsg(t,err){msg.textContent=t;msg.className='msg'+(err?' err':'');msg.hidden=!t}
  function enable(on){['prev','next','pageInput','zout','zin','fit','zoomInput'].forEach(function(i){$(i).disabled=!on});updateNav()}
  function updateNav(){
    if(!pdf)return;
    $('pageInput').value=pageNum;$('pageInput').max=pdf.numPages;
    $('pageCount').textContent='/ '+pdf.numPages;
    $('prev').disabled=pageNum<=1;$('next').disabled=pageNum>=pdf.numPages;
    $('zoomInput').value=Math.round(scale*100);
  }

  if(!window.pdfjsLib){setMsg('The PDF engine could not load. Check your connection and reload.',true);return}
  pdfjsLib.GlobalWorkerOptions.workerSrc='https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';

  function fitScale(page){
    var w=stage.clientWidth-parseFloat(getComputedStyle(stage).paddingLeft)-parseFloat(getComputedStyle(stage).paddingRight);
    return Math.max(.25,Math.min(4,w/page.getViewport({scale:1}).width));
  }

  async function renderPage(){
    if(!pdf||mode!=='page')return;
    var token=++renderToken;
    if(task){try{task.cancel()}catch(e){}}
    var page=await pdf.getPage(pageNum);
    if(token!==renderToken)return;
    if(fitMode)scale=fitScale(page);
    var vp=page.getViewport({scale:scale}),dpr=window.devicePixelRatio||1;
    canvas.width=Math.floor(vp.width*dpr);canvas.height=Math.floor(vp.height*dpr);
    canvas.style.width=Math.floor(vp.width)+'px';canvas.style.height=Math.floor(vp.height)+'px';
    var ctx=canvas.getContext('2d');
    task=page.render({canvasContext:ctx,viewport:vp,transform:dpr!==1?[dpr,0,0,dpr,0,0]:null});
    try{await task.promise}catch(e){if(e&&e.name==='RenderingCancelledException')return;setMsg('This page could not be drawn.',true)}
    updateNav();
  }

  async function renderText(){
    if(!pdf||mode!=='text')return;
    var n=pageNum;
    if(textCache[n]===undefined){
      var page=await pdf.getPage(n),tc=await page.getTextContent(),out='';
      tc.items.forEach(function(it){out+=it.str+(it.hasEOL?'\n':' ')});
      textCache[n]=out.replace(/[ \t]+\n/g,'\n').trim();
    }
    if(n!==pageNum)return;
    textBody.textContent=textCache[n]||'No selectable text on this page. It may be a scanned image.';
    textInfo.textContent='Text from page '+n+' of '+pdf.numPages;
    updateNav();
  }

  function refresh(){mode==='page'?renderPage():renderText()}

  function setMode(m){
    mode=m;
    $('tabPage').setAttribute('aria-pressed',m==='page');$('tabText').setAttribute('aria-pressed',m==='text');
    sheet.hidden=(m!=='page'||!pdf);textWrap.hidden=(m!=='text'||!pdf);
    $('zout').disabled=$('zin').disabled=$('fit').disabled=$('zoomInput').disabled=(m!=='page'||!pdf);
    stage.scrollTop=0;refresh();
  }

  function goTo(n){
    if(!pdf)return;
    n=Math.max(1,Math.min(pdf.numPages,n|0||1));
    pageNum=n;stage.scrollTop=0;updateNav();refresh();
  }

  function setScale(s){fitMode=false;scale=Math.max(.25,Math.min(4,s));renderPage()}

  async function load(data,name){
    $('welcome').hidden=true;setMsg('Opening '+name+'…');sheet.hidden=true;textWrap.hidden=true;
    try{
      if(pdf){try{pdf.destroy()}catch(e){}}
      pdf=await pdfjsLib.getDocument({data:data}).promise;
    }catch(e){
      pdf=null;enable(false);
      setMsg(e&&e.name==='PasswordException'?'This PDF is password protected and cannot be opened here.':'That file could not be read as a PDF.',true);
      return;
    }
    textCache={};pageNum=1;fitMode=true;$('fileName').textContent=name;
    setMsg('');enable(true);setMode(mode);
  }

  function openFile(f){
    if(!f)return;
    if(!/pdf$/i.test(f.type)&&!/\.pdf$/i.test(f.name)){setMsg('Choose a file ending in .pdf.',true);return}
    var r=new FileReader();
    r.onload=function(){load(new Uint8Array(r.result),f.name)};
    r.onerror=function(){setMsg('The file could not be read.',true)};
    r.readAsArrayBuffer(f);
  }

  $('file').addEventListener('change',function(e){openFile(e.target.files[0]);e.target.value=''});
  Array.prototype.forEach.call(document.querySelectorAll('label.btn'),function(l){
    l.addEventListener('keydown',function(e){if(e.key==='Enter'||e.key===' '){e.preventDefault();$('file').click()}});
  });
  $('prev').onclick=function(){goTo(pageNum-1)};
  $('next').onclick=function(){goTo(pageNum+1)};
  $('pageInput').addEventListener('change',function(e){goTo(parseInt(e.target.value,10))});
  $('zin').onclick=function(){setScale(scale*1.2)};
  $('zout').onclick=function(){setScale(scale/1.2)};
  $('fit').onclick=function(){fitMode=true;renderPage()};
  $('zoomInput').addEventListener('change',function(e){
    var v=parseFloat(e.target.value);
    if(isNaN(v)){updateNav();return}
    setScale(v/100);
  });
  $('tabPage').onclick=function(){setMode('page')};
  $('tabText').onclick=function(){setMode('text')};
  $('copyText').onclick=function(){
    var t=textBody.textContent,b=$('copyText');
    function done(ok){b.textContent=ok?'Copied':'Select and copy';setTimeout(function(){b.textContent='Copy text'},1600)}
    try{navigator.clipboard.writeText(t).then(function(){done(true)},function(){sel();done(false)})}catch(e){sel();done(false)}
    function sel(){var r=document.createRange();r.selectNodeContents(textBody);var s=getSelection();s.removeAllRanges();s.addRange(r)}
  };

  document.addEventListener('keydown',function(e){
    if(/INPUT|TEXTAREA/.test((e.target.tagName||'')))return;
    if(e.key==='ArrowLeft'||e.key==='PageUp')goTo(pageNum-1);
    else if(e.key==='ArrowRight'||e.key==='PageDown')goTo(pageNum+1);
  });

  var dragDepth=0;
  window.addEventListener('dragenter',function(e){e.preventDefault();dragDepth++;$('drop').hidden=false});
  window.addEventListener('dragleave',function(){dragDepth=Math.max(0,dragDepth-1);if(!dragDepth)$('drop').hidden=true});
  window.addEventListener('dragover',function(e){e.preventDefault()});
  window.addEventListener('drop',function(e){e.preventDefault();dragDepth=0;$('drop').hidden=true;
    var f=e.dataTransfer&&e.dataTransfer.files[0];openFile(f)});

  var rt;window.addEventListener('resize',function(){clearTimeout(rt);rt=setTimeout(function(){if(fitMode&&mode==='page')renderPage()},150)});

})();
</script>

</body></html>
